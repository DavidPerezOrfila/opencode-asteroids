name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # El bot comenta sus propios errores en la issue, y cualquier enlace a este
    # repo contiene "/opencode-asteroids", asi que un contains() solo genera un
    # bucle infinito de runs. Exigimos que la mencion empiece al principio del
    # comentario y que el autor no sea un bot.
    if: github.event.comment.user.type != 'Bot' && (startsWith(trim(github.event.comment.body), '/oc') || startsWith(trim(github.event.comment.body), '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        with:
          model: opencode/mimo-v2.6-flash-free
