name: issue-triage
on:
  issues:
    types: [opened]
  # Re-procesar un issue a mano: útil cuando el cuerpo original ya fue reemplazado
  # por una ejecución anterior o cuando se corrige la lógica.
  workflow_dispatch:
    inputs:
      issue:
        description: 'Número de issue a formatear'
        required: true
        type: string

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Triage issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue || github.event.issue.number }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C.UTF-8
          cd "$GITHUB_WORKSPACE"

          # Se lee el issue por API en vez de usar el payload del evento: así el
          # mismo script sirve para `issues: opened` y para `workflow_dispatch`.
          issue=$(gh issue view "$ISSUE_NUMBER" --json title,body,author)
          ISSUE_TITLE=$(jq -r '.title' <<<"$issue")
          ISSUE_BODY=$(jq -r '.body // ""' <<<"$issue")
          AUTHOR=$(jq -r '.author.login' <<<"$issue")

          # ── 1. Título normalizado (una sola línea, sin espacios redundantes) ──────
          title=$(printf '%s' "$ISSUE_TITLE" \
            | tr -d '\r' \
            | tr '\n\t' '  ' \
            | sed -E 's/[[:space:]]+/ /g; s/^ +//; s/ +$//' \
            | cut -c1-240)
          [ -n "$title" ] || title="(sin título)"

          # ── 2. Original real ─────────────────────────────────────────────────────
          # El texto que escribió la persona viaja codificado en base64 dentro del
          # marker del final. Si ya está, se recupera de ahí; si no, el cuerpo actual
          # es el original. Va antes del `haystack` para que una segunda pasada
          # clasifique sobre el texto real y no sobre el bloque de triage anidado.
          original=""
          if grep -q '<!-- opencode-triage:v1 ' <<<"$ISSUE_BODY"; then
            original=$(sed -n 's/^<!-- opencode-triage:v1 //p' <<<"$ISSUE_BODY" \
              | head -1 | sed 's/ -->$//' | base64 -d 2>/dev/null) || original=""
          fi
          [ -n "$original" ] || original="$ISSUE_BODY"

          # ── 3. Etiquetas por palabras clave (ES + EN) ────────────────────────────
          haystack=$(printf '%s %s' "$title" "$original" \
            | tr -d '\r' \
            | sed -E 's/[[:space:]]+/ /g')
          haystack=${haystack,,}
          # Solo minúsculas. Los acentos se resuelven en los propios regex (`c[oó]mo`),
          # no plegándolos aquí: `sed` con clases multibyte depende del locale y en C
          # falla expandingiendo la clase letra a letra.

          labels=()
          has() { local n; for n in "${labels[@]}"; do [ "$n" = "$1" ] && return 0; done; return 1; }

          # add <label> <color> <descripción>
          # Crear la etiqueta va aquí y no en las reglas: toda etiqueta que entra en
          # la lista debe existir en el repo antes de `gh issue edit --add-label`.
          add() {
            has "$1" && return 0
            labels+=("$1")
            gh label create "$1" --color "$2" --description "$3" >/dev/null 2>&1 || true
          }

          rule() { # rule <label> <color> <descripción> <regex>
            # here-string y no pipe: grep -q cerrando antes hace que printf reciba
            # SIGPIPE y, con pipefail, la regla no casaría de forma intermitente.
            if grep -Eqi "$4" <<<"$haystack"; then
              add "$1" "$2" "$3"
            fi
          }

          add "needs-triage" "fbca04" "Pendiente de revision humana"
          rule "question"      "d876e3" "Duda sobre el comportamiento actual" '(^|[^a-z])(c[oó]mo|how|why|duda|pregunta)([^a-z]|$)|\?'
          rule "bug"           "d73a4a" "Algo no funciona como debería"    '(^|[^a-z])(bug|error|roto|rompe|falla|fallo|crashea|broken|crash|no (funciona|anda|arranca)|doesn.t work)([^a-z]|$)'
          rule "documentation" "0075ca" "Documentacion o README"           '(^|[^a-z])(doc|docs|documentaci[oó]n|readme|typo|texto)([^a-z]|$)'
          rule "test"          "b60205" "Pruebas o cobertura"              '(^|[^a-z])(test|tests|pruebas?|coverage|cobertura|e2e)([^a-z]|$)'
          rule "refactor"      "c2e0c6" "Limpieza de codigo sin cambiar comportamiento" '(^|[^a-z])(refactor|refactorizar|limpiar|limpieza|simplificar|clean ?up|cleanup|reordenar)([^a-z]|$)'
          rule "performance"   "1d76db" "Velocidad o consumo de recursos"  '(^|[^a-z])(rendimiento|performance|lento|slow|optimizar|optimiza|memoria|fps)([^a-z]|$)'
          rule "enhancement"   "a2eeef" "Nueva funcionalidad o mejora"     '(^|[^a-z])(feature|m[ée]jora|a[ñn]adir|agregar|nuev[oa]|propuesta|idea|add|implement|implementar|soporte|support|aumentar|duplicar|agrandar|ampliar|tama[ñn]o|resoluci[oó]n|pantalla completa)([^a-z]|$)'

          # ── 4. Cuerpo: metadatos arriba, texto original intacto abajo ────────────
          version=$(node -p "require('./package.json').version" 2>/dev/null || echo "n/d")

          {
            printf '### Triage automático\n\n'
            printf '| Campo | Valor |\n|---|---|\n'
            printf '| Autor | @%s |\n' "$AUTHOR"
            printf '| Creado | %s |\n' "$(date -u +'%Y-%m-%d %H:%M UTC')"
            printf '| Commit | `%s` |\n' "${HEAD_SHA:0:7}"
            printf '| Versión | `%s` |\n' "$version"
            printf '| Issue | #%s |\n' "$ISSUE_NUMBER"
            printf '| Etiquetas | %s |\n' "$(printf '%s, ' "${labels[@]}" | sed -E 's/, $//')"
            printf '\n'
            printf -- '---\n\n### Original (sin modificar)\n\n'
            if [ -n "$original" ]; then printf '%s\n' "$original"; else printf '*(sin descripción)*\n'; fi
            # base64 en una sola línea: `base64 -w0`, para que el marker ocupe una
            # única línea y el sed de recuperación pueda leerlo con `head -1`.
            printf '\n<!-- opencode-triage:v1 %s -->\n' "$(printf '%s' "$original" | base64 -w0)"
          } > "$RUNNER_TEMP/body.md"

          # ── 5. Aplicar cambios ──────────────────────────────────────────────────
          gh issue edit "$ISSUE_NUMBER" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          gh issue edit "$ISSUE_NUMBER" --add-label "$(IFS=,; echo "${labels[*]}")"
